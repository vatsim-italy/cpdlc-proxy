# Values come from .env (see .env.example).
services:
  cpdlc-proxy:
    # Built by .github/workflows/image.yml on every push.
    image: ghcr.io/vatsim-italy/cpdlc-proxy:${CPDLC_PROXY_TAG:-latest}
    restart: unless-stopped
    environment:
      HOPPIE_LOGON: ${HOPPIE_LOGON:?set HOPPIE_LOGON in .env}
    volumes:
      - ./config.json:/config/config.json:ro
      # Named volume, not ./data: it inherits the image's /data owner (uid 65532).
      - cpdlc-state:/data
    # networks:
    #   - traefik
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.cpdlc-proxy.rule=Host(`${CPDLC_PROXY_HOST:?set CPDLC_PROXY_HOST in .env}`)
    #   - traefik.http.routers.cpdlc-proxy.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
    #   - traefik.http.routers.cpdlc-proxy.tls=true
    #   - traefik.http.routers.cpdlc-proxy.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
    #   - traefik.http.routers.cpdlc-proxy.service=cpdlc-proxy
    #   - traefik.http.services.cpdlc-proxy.loadbalancer.server.port=8080
    #   - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cpdlc-state:

